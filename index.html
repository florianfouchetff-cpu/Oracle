<style>
/* Bandeaux hauts : décalés de la zone système iPhone (heure/notch) via la safe-area.
   viewport-fit=cover au meta rend env(safe-area-inset-top) non nul ; si env() n'est
   pas supporté, ces règles tombent et le comportement reste celui d'avant. */
body { padding-top: env(safe-area-inset-top); }
.sticky.top-0 { top: env(safe-area-inset-top); }
.fixed.top-1\.5 { top: calc(env(safe-area-inset-top) + 0.375rem); }
/* v0.86 (retour du tireur) : les voiles (fixed inset-0) partaient de y=0, sous la
   zone horloge/batterie iPhone : leur bandeau et son bouton fermer devenaient
   intouchables au doigt quand le contenu etait haut. Le wrapper des voiles descend de la
   safe-area plus une marge ; le panneau interne (max-h-full) suit, box-sizing
   border-box garde tout dans l'ecran. Si env() n'est pas supporte, la regle
   tombe et le comportement reste celui d'avant. */
.fixed.inset-0 { padding-top: calc(env(safe-area-inset-top) + 0.75rem); }
</style>
