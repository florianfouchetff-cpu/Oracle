name: icones Pythie + Pythie Lite
# Regener les icones des apps (icon-180/192/512.png) depuis les generateurs
# deterministes tools/gen_icon.mjs (Pythie, l'oeil cible) et tools/gen_icon_lite.mjs
# (Pythie Lite, Apollon solaire) - pur Node, aucune dependance. Se declenche quand
# un generateur ou ce fichier change ; declenchement manuel possible depuis
# l'onglet Actions.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gen-icons.yml', 'tools/gen_icon.mjs', 'tools/gen_icon_lite.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generation
        run: |
          node tools/gen_icon.mjs .
          node tools/gen_icon_lite.mjs lite
      - name: commit si changement
        run: |
          git config user.name "pythie-actions"
          git config user.email "actions@users.noreply.github.com"
          git add icon-180.png icon-192.png icon-512.png lite/icon-180.png lite/icon-192.png lite/icon-512.png
          if git diff --cached --quiet; then
            echo "icones inchangees"
          else
            git commit -m "icones Pythie + Pythie Lite (generees par tools/gen_icon*.mjs)"
            git push
          fi
